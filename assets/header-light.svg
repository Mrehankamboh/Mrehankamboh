    <text x="70" y="268" fill="#667085" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">React  |  Next.js  |  NestJS  |  Rust</text>
    <rect x="1036" y="108" width="144" height="144" rx="32" fill="#0B1220"/>
