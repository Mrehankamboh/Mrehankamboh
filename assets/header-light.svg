<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Muhammad Rehan Kamboh. I build websites, frontend and backend.">
  <title>Muhammad Rehan Kamboh. I build websites, frontend and backend.</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D5DDE6"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 40) scale(340)">
      <stop offset="0" stop-color="#0A7A50" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0A7A50" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="280" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="280" fill="#F7F9FB"/>
    <rect width="1280" height="280" fill="url(#dots)"/>
    <rect width="1280" height="280" fill="url(#glow)"/>
    <circle cx="64" cy="72" r="6" fill="#0A7A50"/>
