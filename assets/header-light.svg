    <text x="64" y="148" fill="#0B1220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700">Muhammad Rehan Kamboh</text>
    <text x="64" y="198" fill="#475467" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">I build websites, frontend and backend.</text>
    <text x="64" y="236" fill="#667085" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">React  ·  Next.js  ·  NestJS  ·  Rust</text>
    <rect x="0.75" y="0.75" width="1278.5" height="278.5" rx="23.5" fill="none" stroke="#DDE3EA" stroke-width="1.5"/>
  </g>
</svg>
